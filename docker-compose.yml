services:
  spotless:
    # Prebuilt multi-arch image (amd64 + arm64) published by CI; `docker compose pull` updates it.
    # Remove the `build:` line below if you never want to build locally.
    image: ghcr.io/dj2swagittarius/spotless:latest
    build: .
    container_name: spotless
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Dedicated write mount used only for optional generated .lrc sidecars.
      - MUSIC_WRITE_DIR=/music-write
    #   # uid/gid that owns ./data and runs the app (default 1000/1000); match the host user
    #   # that owns your music folder, e.g. the output of `id -u` / `id -g`
    #   - PUID=1000
    #   - PGID=1000
    #   # optional — enables the Spotify taste/playlist import (see README)
    #   - SPOTIFY_CLIENT_ID=your_spotify_app_client_id
    #   # optional AI DJ defaults (Settings → AI DJ overrides them); host.docker.internal = the Docker host
    #   - OLLAMA_URL=http://host.docker.internal:11434
    #   - LMSTUDIO_URL=http://host.docker.internal:1234/v1
    #   - TTS_URL=http://host.docker.internal:8880/v1
    #   - STT_URL=http://host.docker.internal:8000/v1
    #   # optional deployment default for reverse-proxy OAuth; Settings → Spotify can override it
    #   - SPOTIFY_REDIRECT_URI=https://music.example.com/api/spotify/callback
    # lets the AI DJ reach Ollama / LM Studio / voice servers running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Main application access stays read-only.
      - /path/to/your/music:/music:ro
      # Optional synced-lyrics writer: same host library mounted separately read/write.
      # Spotless writes only generated same-basename .lrc sidecars through this path.
      - /path/to/your/music:/music-write:rw
      # persistent app data (database, extracted album art, backups)
      - ./data:/data
