name: Build and publish container image

# Builds the app image on every push to main (and on v* tags) and publishes it to GHCR.
# Self-hosted installs pull ghcr.io/<owner>/spotless:latest; Watchtower
# (or any pull-based updater) picks the new digest up on its next poll.
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same gate as ci.yml: never publish an image from a tree that does not typecheck, lint,
  # test and build.
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # QEMU provides the arm64 emulation for the multi-platform build (Raspberry Pi, Apple Silicon hosts).
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io requires a lowercase path; github.repository preserves owner casing.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # main -> latest + sha; v1.2.3 tag -> 1.2.3 and 1.2 (latest follows main only, never a tag).
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Desktop installers for a release (Windows, macOS, Linux); only built for v* tags, not every
  # push to main. Pull requests that touch desktop/ build them through desktop.yml directly.
  desktop:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/desktop.yml

  # Android APK for a release; only built for v* tags. Pull requests that touch android/ build it
  # through android.yml directly.
  android:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    secrets: inherit

  # A vX.Y.Z tag (created by `npm run release`) becomes a GitHub Release once its image is
  # published, with that version's CHANGELOG section as the notes and the desktop installers attached.
  release:
    # android stays in needs so its APK artifact is awaited, but a failed Android build must not block the
    # server's release (the APK download below is continue-on-error)
    needs: [build, desktop, android]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.build.result == 'success' && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check that the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG — use npm run release" >&2
            exit 1
          fi

      - name: Collect release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          node scripts/release.mjs --notes "$VERSION" > notes.md
          echo >> notes.md
          case "$VERSION" in
            *-*) echo "**Container image:** \`$IMAGE:$VERSION\` (pre-release; \`:latest\` is unchanged)" >> notes.md ;;
            *)   echo "**Container image:** \`$IMAGE:$VERSION\` (also \`:${VERSION%.*}\`)" >> notes.md ;;
          esac
          echo >> notes.md
          echo "**Desktop app:** download the installer for your system below and point it at your server." >> notes.md
          cat notes.md

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: desktop-dist
          merge-multiple: true

      # absent when the signing secrets are not configured
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: android-apk
          path: desktop-dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # mention the APK only when this release actually has one (it needs the signing secrets)
          if ls desktop-dist/Spotless-*.apk >/dev/null 2>&1; then
            echo >> notes.md
            echo "**Android app:** install the Spotless .apk below on your phone (allow installs from your browser or file manager when asked) and point it at your server." >> notes.md
          fi
          EXTRA=""
          case "$GITHUB_REF_NAME" in *-*) EXTRA="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Spotless $GITHUB_REF_NAME" --notes-file notes.md $EXTRA desktop-dist/*
