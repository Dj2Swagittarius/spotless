# Throwaway test stack for local development (see CONTRIBUTING.md).
# Uses its own container name, host port 3300 and ./test-env/* folders so it can run next to
# a production `docker compose up` on port 3000 without colliding with it or its ./data.
#   docker compose -f docker-compose.test.yml up --build
services:
  spotless-test:
    build:
      context: .
    container_name: spotless-test
    restart: "no"

    ports:
      - "3300:3000"

    environment:
      MUSIC_DIR: /music
      MUSIC_WRITE_DIR: /music-write
      DATA_DIR: /data
      PORT: 3000
      HOSTNAME: 0.0.0.0

    volumes:
      - ./test-env/music:/music:ro
      - ./test-env/music:/music-write:rw
      - ./test-env/data:/data
