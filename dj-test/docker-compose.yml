# Local AI DJ test stack: Spotless + Kokoro (TTS) + Speaches (Whisper STT).
# Start: start-dj-test.bat (Windows) or ./start-dj-test.sh, then open http://localhost:3300/dj
#
# Defaults: LM Studio on this machine (gpt-oss preferred, auto-picked when no model is set)
# and ~/Music as the library. For your own setup (LM Studio on another machine, a NAS share),
# copy docker-compose.override.example.yml to docker-compose.override.yml and edit it.
# Compose loads the override automatically and it is gitignored.
name: spotless-dj-test

services:
  spotless:
    build: ..
    restart: unless-stopped
    ports:
      - "3300:3000"
    environment:
      - DJ_PROVIDER=lmstudio
      - LMSTUDIO_URL=http://host.docker.internal:1234/v1
      - TTS_URL=http://kokoro:8880/v1
      - STT_URL=http://speaches:8000/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ~/Music:/music:ro
      - data:/data
    depends_on:
      - kokoro
      - speaches

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: unless-stopped

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    volumes:
      - speaches-models:/home/ubuntu/.cache/huggingface/hub

volumes:
  data:
  speaches-models:
